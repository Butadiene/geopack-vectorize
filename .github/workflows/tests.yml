name: Tests

"on": [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test and build dependencies
        run: python -m pip install numpy scipy pytest setuptools wheel

      - name: Check scalar and vectorized calculations
        run: >-
          python -m pytest -q tests/ --ignore=tests/test_distribution.py

      # These tests build wheels and sdists, install them outside the checkout,
      # and run Python in isolated mode so source files cannot mask omissions.
      - name: Check installed wheel and source distribution
        run: python -m pytest -q tests/test_distribution.py
